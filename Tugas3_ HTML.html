<!DOCTYPE html>
<html>
<head>
  <title>Sistem Manajemen Produk Toko</title>
</head>
<body>
  <h1>Daftar Produk Toko</h1>
  <pre id="output"></pre>

  <script>
    // Array untuk menyimpan daftar produk
    let produkToko = [
      { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
      { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
      { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
    ];

    // Fungsi untuk menambahkan produk baru
    function tambahProduk(nama, harga, stok) {
      let idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
      let produkBaru = { id: idBaru, nama: nama, harga: harga, stok: stok };
      produkToko.push(produkBaru);
    }

    // Fungsi untuk menghapus produk berdasarkan id
    function hapusProduk(id) {
      produkToko = produkToko.filter(produk => produk.id !== id);
    }

    // Fungsi untuk menampilkan daftar produk
    function tampilkanProduk() {
      let output = "ID\tNama\t\tHarga\t\tStok\n";
      output += "------------------------------------------\n";
      produkToko.forEach(p => {
        output += `${p.id}\t${p.nama}\t\tRp${p.harga}\t${p.stok}\n`;
      });
      document.getElementById("output").textContent = output;
    }

    // Contoh penggunaan
    tambahProduk("Monitor", 1200000, 4);
    hapusProduk(2); // Menghapus produk dengan id 2 (Mouse)
    tampilkanProduk();
  </script>
</body>
</html>
