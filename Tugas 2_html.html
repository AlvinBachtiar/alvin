<!DOCTYPE html>
<html>
<head>
  <title>Data Pegawai</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: left;
    }
    thead {
      background-color: #f2f2f2;
    }
    tfoot {
      font-weight: bold;
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Nama Pegawai</th>
        <th>Umur</th>
        <th>Jabatan</th>
        <th>Status</th>
        <th>Gaji Pokok</th>
        <th>Tunjangan Jabatan</th>
        <th>BPJS</th>
        <th>Tunjangan Keluarga</th>
      </tr>
    </thead>
    <tbody id="data-pegawai">
      <!-- Isi akan di-generate oleh JavaScript -->
    </tbody>
    <tfoot>
      <tr>
        <td colspan="7">Total Gaji</td>
        <td id="total-gaji"></td>
      </tr>
    </tfoot>
  </table>

  <script>
    // Data pegawai
    const nama = "Dodi Prayodi";
    const umur = 25;
    const jabatan = "Manajer";
    const status = "Menikah";

    // Hitung gaji pokok
    let gapok;
    if (jabatan === "Manajer") {
      gapok = 15000000;
    } else if (jabatan === "Asisten Manajer") {
      gapok = 10000000;
    } else {
      gapok = 5000000;
    }

    // Tunjangan jabatan = 15% dari gapok
    const tunjanganJabatan = 0.15 * gapok;

    // BPJS = 10% dari gapok
    const bpjs = 0.10 * gapok;

    // Tunjangan keluarga (ternary) = 20% dari gapok jika menikah
    const tunjanganKeluarga = (status === "Menikah") ? 0.20 * gapok : 0;

    // Total gaji
    const totalGaji = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

    // Tambahkan ke tabel
    document.getElementById("data-pegawai").innerHTML = `
      <tr>
        <td>${nama}</td>
        <td>${umur} tahun</td>
        <td>${jabatan}</td>
        <td>${status}</td>
        <td>Rp ${gapok.toLocaleString()}</td>
        <td>Rp ${tunjanganJabatan.toLocaleString()}</td>
        <td>Rp ${bpjs.toLocaleString()}</td>
        <td>Rp ${tunjanganKeluarga.toLocaleString()}</td>
      </tr>
    `;

    // Isi total gaji
    document.getElementById("total-gaji").textContent = `Rp ${totalGaji.toLocaleString()}`;
  </script>

</body>
</html>
