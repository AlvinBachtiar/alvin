<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Menghitung Luas Bangun Datar</title>
</head>
<body>
  <h1>Menghitung Luas Bangun Datar</h1>
  <script>
    // Fungsi menghitung luas persegi panjang: panjang × lebar
    function hitungLuasPersegiPanjang(panjang, lebar) {
      return panjang * lebar;
    }

    // Fungsi menghitung luas bujur sangkar: sisi × sisi
    function hitungLuasBujurSangkar(sisi) {
      return sisi * sisi;
    }

    // Fungsi menghitung luas segitiga: ½ × alas × tinggi
    function hitungLuasSegitiga(alas, tinggi) {
      return 0.5 * alas * tinggi;
    }

    // Contoh nilai parameter
    let panjang = 10;
    let lebar = 5;
    let sisi = 7;
    let alas = 8;
    let tinggi = 6;

    // Menampilkan hasil perhitungan di konsol
    console.log("Luas Persegi Panjang:", hitungLuasPersegiPanjang(panjang, lebar));
    console.log("Luas Bujur Sangkar:", hitungLuasBujurSangkar(sisi));
    console.log("Luas Segitiga:", hitungLuasSegitiga(alas, tinggi));
  </script>
</body>
</html>
